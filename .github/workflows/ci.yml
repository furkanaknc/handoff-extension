name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile && node --test --test-concurrency=1 "dist/test/*.test.js"
      - run: npm run package:local
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-codex-handoff-vsix
          path: cursor-codex-handoff-latest.vsix

  release:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:local
      - uses: softprops/action-gh-release@v2
        with:
          files: cursor-codex-handoff-latest.vsix
