name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile && node --test --test-concurrency=1 "dist/test/*.test.js"
      - run: npm run package:local
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-codex-handoff-vsix
          path: cursor-codex-handoff-latest.vsix

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cursor-codex-handoff-vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: cursor-codex-handoff-latest.vsix
